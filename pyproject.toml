[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamst-capture"
version = "0.1.0"
description = "Always-on coin rotation counting with selective GAMST VLM escalation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
verify = ["mediapipe>=0.10"]

[project.scripts]
gamst-capture = "gamst_capture.cli:main"

[tool.setuptools.packages.find]
include = ["gamst_capture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
